<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MovieTracker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/"><img src="favicon.svg" alt="" width="28" height="28"><span>MovieTracker</span></a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="sync-status" id="sync-status" hidden></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <form class="search-form" id="search-form" role="search">
          <span id="search-icon"></span>
          <input id="search-input" type="search" placeholder="Search for a show or movie…  ( / )" autocomplete="off" aria-label="Search shows and movies">
        </form>
      </header>
      <main id="view" class="content"></main>
      <footer class="footer">
        Show and movie data &amp; images from <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>.
        This product uses the TMDB API but is not endorsed or certified by TMDB.
      </footer>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
